# The judges' one-command check, on a fresh checkout: the offline run uses the testnet answers saved in
# demo/rpc-cache/, so it needs no keys and passes even when a testnet RPC is down.
name: demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: make demo ARGS=--offline
        run: make demo ARGS=--offline
